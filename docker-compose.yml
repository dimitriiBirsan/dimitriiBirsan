services:
  website:
    image: ghcr.io/dimitriibirsan/dimitriibirsan:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dimitrii-website
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      
      # Routers for HTTPS (websecure)
      - "traefik.http.routers.dimitrii-website.rule=Host(`${DOMAIN:-dimitrii.dev}`) || Host(`www.${DOMAIN:-dimitrii.dev}`)"
      - "traefik.http.routers.dimitrii-website.entrypoints=websecure"
      - "traefik.http.routers.dimitrii-website.tls=true"
      - "traefik.http.routers.dimitrii-website.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      
      # Internal service port (Nginx runs on port 80 inside the container)
      - "traefik.http.services.dimitrii-website.loadbalancer.server.port=80"

networks:
  traefik-net:
    # Set to your Traefik network name (e.g. 'traefik-net', 'proxy', 'traefik_default')
    name: ${TRAEFIK_NETWORK:-traefik-net}
    external: true
