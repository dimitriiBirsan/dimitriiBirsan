server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Built from hashes of the exact static output, including Shiki styles.
    include /etc/nginx/site-security.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Preserve inbound links with HTTP redirects, including old Italian slugs.
    rewrite ^/it/blog/(.+)\.it/?$ /it/blog/$1/ permanent;
    rewrite ^/dark-patterns(?:/overload)?/?$ /lab/dark-patterns/ permanent;
    rewrite ^/it/dark-patterns(?:/overload)?/?$ /it/lab/dark-patterns/ permanent;
    rewrite ^/tags/(?:architectural|crossroads)/?$ /tags/architecture/ permanent;
    rewrite ^/it/tags/(?:architettura|scelte)/?$ /it/tags/architecture/ permanent;
    rewrite ^/it/tags/microservizi/?$ /it/tags/microservices/ permanent;

    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location /it/ {
        try_files $uri $uri/ =404;
        error_page 404 /it/404/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
