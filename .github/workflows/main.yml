name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          port: 22
          script: |
            # 1. Navigate to your app directory (change 'my-app' to your folder name)
            cd /home/runner/work/dimitriiBirsan/dimitriiBirsan

            # 2. Force Git to overwrite local changes (like package-lock.json)
            git fetch origin main
            git reset --hard origin/main

            # 3. Now run your existing deployment script
            /home/opc/deploy.sh
